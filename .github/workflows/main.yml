name: Build and Publish

on:
  push:
    branches:
      # replace this with main, when yaml is correct
      - __never__
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  packages: write  
  id-token: write

env:
  BUILD_VERSION: "0.1.${{ github.run_number }}"  
  PROJECT_NAME: ${{ github.event.repository.name }}

jobs:

  build:
    name: Build  ${{ github.event.repository.name }}
    runs-on: windows-latest  

    steps:
     
    # setup
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install NuGet
      uses: NuGet/setup-nuget@v4

    # Install docFX
    - name: Install DocFX
      run: dotnet tool install -g docfx

    # - name: Echo Version 
    #  run: echo "Version = ${{ env.BUILD_VERSION }}"
        
    # Compile the solution
    - name: Compile solution
      working-directory: src
      run: dotnet build -c Release -p:BuildVersion=${{ env.BUILD_VERSION }}.0

    # Test
    - name: Run tests
      working-directory: src\${{ env.PROJECT_NAME }}.Test
      run: dotnet test -c Release --no-build -p:BuildVersion=${{ env.BUILD_VERSION }}.0

    # Pack
    - name: Package
      working-directory: src\${{ env.PROJECT_NAME }}
      run: dotnet pack -c Release --no-build -o ..\..\package -p:BuildVersion=${{ env.BUILD_VERSION }}.0

    # Publish
    - name: Publish
      working-directory: src\${{ env.PROJECT_NAME }}
      run: dotnet publish -c Release --no-build -o ..\..\publish -p:BuildVersion=${{ env.BUILD_VERSION }}.0
    
    # Documentation

    - name: Build Documentation
      working-directory: docfx_project
      run: docfx docfx.json
      continue-on-error: false

    - name: Zip binaries
      uses: TheDoctor0/zip-release@0.6.2
      with:
        filename: '${{ env.PROJECT_NAME }}.${{ env.BUILD_VERSION }}-binary.zip'
        directory: publish
        path: '*'
        type: 'zip'

    # create github release
    - name: Create Release
      uses: softprops/action-gh-release@v2        
      with:
        name: Release ${{ env.BUILD_VERSION }}
        tag_name: ${{ env.BUILD_VERSION }}
        files: |
          ./publish/${{ env.PROJECT_NAME }}.${{ env.BUILD_VERSION }}-binary.zip
          ./package/${{ env.PROJECT_NAME }}.${{ env.BUILD_VERSION }}.nupkg      

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    
    # Push the package
    - name: NuGet push
      run: dotnet nuget push **\*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

    # Upload the generated documentation as a GitHub Pages artifact
    - name: Create documentation artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@v4
      with:
        path: docfx_project/docs

    # Deploy the artifact to GitHub Pages
    - name: Deploy documentation artifact to GitHub Pages
      if: github.event_name == 'push'
      id: deployment
      uses: actions/deploy-pages@v4
